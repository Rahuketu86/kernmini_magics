[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "kernmini_magics"
dynamic = ["version"]
description = "Shared machinery for IPython magics that embed a kernmini shell"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Rahul Saraf", email = "rahuketu86@gmail.com"}]
keywords = ['nbdev']
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = ["ipython"]

[project.urls]
Repository = "https://github.com/Rahuketu86/kernmini_magics"
Documentation = "https://Rahuketu86.github.io/kernmini_magics/"

[project.entry-points.nbdev]
kernmini_magics = "kernmini_magics._modidx:d"

[tool.setuptools.dynamic]
version = {attr = "kernmini_magics.__version__"}

[tool.setuptools.packages.find]
include = ["kernmini_magics"]

[tool.nbdev]
# Metadata dialogs depend on, exempt from nbdev_clean (a dialog's settings, prompts' solveit_ai, replies' is_ai_res).
allowed_metadata_keys = ["language", "kernel_type", "actor_type", "solveit"]
allowed_cell_metadata_keys = ["solveit_ai", "skipped", "pinned", "bookmark", "heading_collapsed", "i_collapsed", "o_collapsed", "is_exported"]
allowed_out_metadata_keys = ["is_ai_res"]
